name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      KODA_REQUIRE_LINUX_BUBBLEWRAP: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install Linux sandbox prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes apparmor-profiles apparmor-utils bubblewrap ripgrep

          profile=/etc/apparmor.d/bwrap-userns-restrict
          packaged_profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          if [[ ! -e "$profile" ]]; then
            if [[ ! -f "$packaged_profile" ]]; then
              echo "::error title=Bubblewrap AppArmor profile unavailable::The Ubuntu runner does not provide the scoped bwrap-userns-restrict profile."
              exit 1
            fi
            sudo install -m 0644 "$packaged_profile" "$profile"
          fi
          sudo apparmor_parser -r "$profile"

          if ! /usr/bin/bwrap \
            --die-with-parent \
            --unshare-user \
            --disable-userns \
            --unshare-ipc \
            --unshare-net \
            --ro-bind / / \
            -- /usr/bin/true >/dev/null 2>&1; then
            echo "::error title=Bubblewrap namespace preflight failed::The Ubuntu runner cannot create Koda's required user, mount, IPC, and network namespaces after loading the scoped AppArmor profile."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - name: Build pinned Phase 4C1 legacy executor fixture
        shell: bash
        run: |
          legacy_binary="$RUNNER_TEMP/koda-exec-v1"
          ./scripts/build-phase-4c1-v1-executor.sh "$legacy_binary"
          echo "KODA_LEGACY_EXECUTOR_BINARY=$legacy_binary" >> "$GITHUB_ENV"
      - run: pnpm format:check
      - run: pnpm typecheck
      - name: Run Linux capability startup smoke
        shell: bash
        run: |
          state_directory="$RUNNER_TEMP/koda-linux-smoke-state"
          endpoint="$RUNNER_TEMP/koda-linux-smoke.sock"
          diagnostics="$RUNNER_TEMP/koda-linux-smoke.stderr"
          mkdir -m 0700 "$state_directory"
          target/debug/koda-exec serve \
            --endpoint "$endpoint" \
            --state-dir "$state_directory" \
            2>"$diagnostics" &
          supervisor_pid=$!
          cleanup() {
            kill "$supervisor_pid" 2>/dev/null || true
            wait "$supervisor_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in {1..100}; do
            if [[ -S "$endpoint" ]]; then
              exit 0
            fi
            if ! kill -0 "$supervisor_pid" 2>/dev/null; then
              wait "$supervisor_pid" || true
              trap - EXIT
              diagnostic="$(grep -F 'The Linux Bubblewrap capability probe failed because ' "$diagnostics" | tail -n 1 || true)"
              if [[ -z "$diagnostic" ]]; then
                diagnostic="The Linux capability startup smoke failed without a recognized bounded diagnostic."
              fi
              diagnostic="${diagnostic//'%'/'%25'}"
              diagnostic="${diagnostic//$'\r'/'%0D'}"
              diagnostic="${diagnostic//$'\n'/'%0A'}"
              echo "::error title=Linux capability startup smoke failed::$diagnostic"
              exit 1
            fi
            sleep 0.1
          done

          echo "::error title=Linux capability startup smoke timed out::The native executor did not publish its local endpoint within ten seconds."
          exit 1
      - name: Run full test suite
        shell: bash
        run: |
          set +e
          pnpm test 2>&1 | tee /tmp/koda-test-output.log
          test_status=${PIPESTATUS[0]}
          set -e
          if (( test_status != 0 )); then
            summary="$(tail -n 60 /tmp/koda-test-output.log)"
            summary="${summary//'%'/'%25'}"
            summary="${summary//$'\r'/'%0D'}"
            summary="${summary//$'\n'/'%0A'}"
            echo "::error title=Full test suite failed::$summary"
            exit "$test_status"
          fi

  linux-native:
    runs-on: ubuntu-24.04
    env:
      KODA_REQUIRE_LINUX_BUBBLEWRAP: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Install and verify Linux sandbox prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes apparmor-profiles apparmor-utils bubblewrap ripgrep

          profile=/etc/apparmor.d/bwrap-userns-restrict
          packaged_profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          if [[ ! -e "$profile" ]]; then
            if [[ ! -f "$packaged_profile" ]]; then
              echo "::error title=Bubblewrap AppArmor profile unavailable::The Ubuntu runner does not provide the scoped bwrap-userns-restrict profile."
              exit 1
            fi
            sudo install -m 0644 "$packaged_profile" "$profile"
          fi
          sudo apparmor_parser -r "$profile"

          echo "Bubblewrap path: $(realpath /usr/bin/bwrap)"
          echo "Bubblewrap version: $(/usr/bin/bwrap --version)"
          stat --format='Bubblewrap identity: device=%d inode=%i size=%s mtime=%Y mode=%a owner=%u' /usr/bin/bwrap
          if ! /usr/bin/bwrap \
            --die-with-parent \
            --unshare-user \
            --disable-userns \
            --unshare-ipc \
            --unshare-net \
            --ro-bind / / \
            -- /usr/bin/true >/dev/null 2>&1; then
            echo "::error title=Bubblewrap namespace preflight failed::The Ubuntu runner cannot create Koda's required user, mount, IPC, and network namespaces."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm -r --if-present build
      - run: cargo build -p koda-exec
      - name: Build pinned Phase 4C1 legacy executor fixture
        shell: bash
        run: |
          legacy_binary="$RUNNER_TEMP/koda-exec-v1"
          ./scripts/build-phase-4c1-v1-executor.sh "$legacy_binary"
          echo "KODA_LEGACY_EXECUTOR_BINARY=$legacy_binary" >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run Linux native Rust acceptance
        shell: bash
        run: |
          set +e
          cargo test -p koda-exec -- --nocapture 2>&1 | tee /tmp/koda-linux-native-rust.log
          test_status=${PIPESTATUS[0]}
          set -e
          if (( test_status != 0 )); then
            summary="$(tail -n 60 /tmp/koda-linux-native-rust.log)"
            summary="${summary//'%'/'%25'}"
            summary="${summary//$'\r'/'%0D'}"
            summary="${summary//$'\n'/'%0A'}"
            echo "::error title=Linux native Rust acceptance failed::$summary"
            exit "$test_status"
          fi
      - name: Run Linux protected execution and client acceptance
        shell: bash
        run: |
          set +e
          pnpm exec vitest run --no-file-parallelism \
            packages/testkit/src/native-executor-client.test.ts \
            packages/testkit/src/native-execution-policy.test.ts \
            packages/testkit/src/workspace-command-runner.test.ts \
            packages/testkit/src/execution-policy.test.ts \
            packages/testkit/src/app-server-protocol.test.ts \
            packages/testkit/src/cli.test.ts \
            packages/testkit/src/tui-view.test.ts \
            2>&1 | tee /tmp/koda-linux-native-vitest.log
          test_status=${PIPESTATUS[0]}
          set -e
          if (( test_status != 0 )); then
            summary="$(tail -n 80 /tmp/koda-linux-native-vitest.log)"
            summary="${summary//'%'/'%25'}"
            summary="${summary//$'\r'/'%0D'}"
            summary="${summary//$'\n'/'%0A'}"
            echo "::error title=Linux protected execution acceptance failed::$summary"
            exit "$test_status"
          fi

  macos-native:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @koda/runtime-node... build
      - run: cargo build -p koda-exec
      - name: Build pinned Phase 4C1 legacy executor fixture
        shell: bash
        run: |
          legacy_binary="$RUNNER_TEMP/koda-exec-v1"
          ./scripts/build-phase-4c1-v1-executor.sh "$legacy_binary"
          echo "KODA_LEGACY_EXECUTOR_BINARY=$legacy_binary" >> "$GITHUB_ENV"
      - name: Run macOS native execution-policy acceptance
        run: >-
          pnpm exec vitest run
          packages/testkit/src/native-executor-client.test.ts
          packages/testkit/src/native-execution-policy.test.ts

  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run Windows native Rust tests
        shell: pwsh
        run: |
          $output = @(& cargo test -p koda-exec -- --nocapture 2>&1)
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) {
            $summary = (($output | Select-Object -Last 40) -join "`n")
            $summary = $summary.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Output "::error title=Windows native Rust tests failed::$summary"
            exit $exitCode
          }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @koda/runtime-node... build
      - run: cargo build -p koda-exec
      - name: Run Windows native execution-policy acceptance
        run: >-
          pnpm exec vitest run --no-file-parallelism
          packages/testkit/src/native-executor-client.windows.test.ts
          packages/testkit/src/native-execution-policy.test.ts
