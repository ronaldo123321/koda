name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - name: Run full test suite
        shell: bash
        run: |
          set +e
          pnpm test 2>&1 | tee /tmp/koda-test-output.log
          test_status=${PIPESTATUS[0]}
          set -e
          if (( test_status != 0 )); then
            summary="$(tail -n 60 /tmp/koda-test-output.log)"
            summary="${summary//'%'/'%25'}"
            summary="${summary//$'\r'/'%0D'}"
            summary="${summary//$'\n'/'%0A'}"
            echo "::error title=Full test suite failed::$summary"
            exit "$test_status"
          fi

  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run Windows native Rust tests
        shell: pwsh
        run: |
          $output = @(& cargo test -p koda-exec -- --nocapture 2>&1)
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) {
            $summary = (($output | Select-Object -Last 40) -join "`n")
            $summary = $summary.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Output "::error title=Windows native Rust tests failed::$summary"
            exit $exitCode
          }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @koda/runtime-node... build
      - run: cargo build -p koda-exec
      - run: pnpm exec vitest run packages/testkit/src/native-executor-client.windows.test.ts
